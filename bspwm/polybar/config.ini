; ~/.config/polybar/config.ini — legenddots (minimal): ram · battery · date

[colors]
bg = #1a1b26
fg = #c0caf5
ac = #7aa2f7

[bar/main]
width = 100%
height = 24
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-right = memory battery date
padding-right = 2
module-margin = 2

[module/memory]
type = internal/memory
interval = 3
label = ram %percentage_used%%

[module/battery]
type = internal/battery
; adjust to your hardware — `ls /sys/class/power_supply`. On a desktop with no
; battery this module just shows nothing.
battery = BAT0
adapter = ADP1
label-charging = bat %percentage%%+
label-discharging = bat %percentage%%
label-full = bat %percentage%%=

[module/date]
type = internal/date
interval = 30
date = %a %d %b %H:%M
label = %date%
