[window]
opacity = 1.0
decorations = "None"
padding = { x = 8, y = 8 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[cursor]
style = "Block"
unfocused_hollow = true

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.cursor]
cursor = "#c0caf5"
text   = "#1a1b26"

[colors.selection]
background = "#283457"
text       = "CellForeground"

# Vim keys: Ctrl+Shift+Space enters vi mode (hjkl, w/b, v to select, y to yank,
# / to search, i or Esc to leave). Scroll without leaving the keyboard row:
[keyboard]
bindings = [
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "K",     mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J",     mods = "Control|Shift", action = "ScrollLineDown" },
  { key = "U",     mods = "Control|Shift", action = "ScrollHalfPageUp" },
  { key = "D",     mods = "Control|Shift", action = "ScrollHalfPageDown" },
  { key = "G",     mods = "Control|Shift", action = "ScrollToBottom" },
]
