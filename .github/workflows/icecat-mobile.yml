name: Build IceCat APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'icecat-mobile/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build-tools (zipalign, apksigner)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticate the API call so repeated runs don't hit the 60/hr
          # anonymous rate limit; fall back to a pinned version if it still fails.
          APKTOOL_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.tag_name // empty' | sed 's/^v//')
          [ -n "$APKTOOL_VERSION" ] || APKTOOL_VERSION=2.11.1
          echo "Using apktool $APKTOOL_VERSION"
          sudo curl -fL -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          test -s /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Build IceCat APK
        working-directory: icecat-mobile
        run: ./scripts/package.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: icecat-apk
          path: icecat-mobile/dist/icecat.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icecat-latest
          name: IceCat (latest)
          body: |
            Automatically rebuilt from the upstream Fennec F-Droid APK.
            Download `icecat.apk` below and sideload it. See
            `icecat-mobile/README.md` for details and caveats.
          make_latest: true
          files: icecat-mobile/dist/icecat.apk
