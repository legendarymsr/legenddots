# ~/.config/tmux/tmux.conf — Tokyo Night, vim-flavoured to mirror the nvim config.

### PREFIX — nvim's leader is Space; mirror that as Alt+Space here.
### (Space alone can't be a prefix: the shell needs the space key to type.)
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

### GENERAL
set -g mouse on
set -g base-index 1                 # windows start at 1, like your Mod+1..9
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10               # snappy <Esc> — matters inside nvim
set -g history-limit 50000
set -g focus-events on              # let nvim's FocusGained/autoread fire
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB" # truecolor — Tokyo Night needs it
set -g set-clipboard on

### VI EVERYWHERE
setw -g mode-keys vi
set -g status-keys vi

### SPLITS — vim mnemonics, opened in the current pane's dir
unbind '"'
unbind %
bind s split-window -v -c "#{pane_current_path}"   # horizontal split (stacked)
bind v split-window -h -c "#{pane_current_path}"    # vertical split (side by side)
bind c new-window     -c "#{pane_current_path}"

### PANE FOCUS — hjkl, exactly like nvim window moves
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### PANE RESIZE — prefix then Shift+HJKL, repeatable
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

### WINDOWS — Alt+h/l cycles without the prefix
bind -n M-h previous-window
bind -n M-l next-window

### COPY MODE — v select, y yank, like nvim visual
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

### RELOAD — prefix r (like :source in nvim)
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

########################################################################
### TOKYO NIGHT — same palette as nvim / alacritty
### bg #1a1b26  fg #c0caf5  blue #7aa2f7  purple #bb9af7  dim #414868  comment #565f89
########################################################################
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-interval 5

set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%Y-%m-%d #[fg=#7aa2f7,bold]%H:%M "
set -g status-right-length 40

setw -g window-status-format         "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#414868,fg=#bb9af7,bold] #I:#W "
setw -g window-status-separator ""

# panes: active border blue, inactive dim — matches the Hyprland window borders
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# prompt + copy selection
set -g message-style "bg=#414868,fg=#c0caf5"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
