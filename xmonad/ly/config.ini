# /etc/ly/config.ini — legenddots (minimal)
# Only the overrides; the package ships full defaults at /etc/ly/config.ini.

# no animation, plain TUI login
animation = none

# 24h clock, top-right
clock = %H:%M

# remember the last user + session
save = true

# XMonad appears as a session from /usr/share/xsessions/xmonad.desktop
# (installed by install.sh) — choose it with the left/right arrows.
